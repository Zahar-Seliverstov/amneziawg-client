name: Релиз

# Релиз выпускается пушем тега: git tag -a v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]

# Нужно для публикации релиза от имени GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    name: Сборка архивов
    # Обе программы собираются без cgo, так что от glibc раннера архивы не
    # зависят. Windows-версия собирается здесь же, кросс-компиляцией.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Версия из тега
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Расхождение версии в теге и в файле VERSION — ровно то, из-за чего в
      # релизе оказываются файлы с чужим номером. Ловим до сборки.
      - name: Проверить, что версия в теге и в VERSION совпадает
        run: |
          version='${{ steps.version.outputs.value }}'
          fail=0

          declared="$(cat VERSION)"
          if [ "$declared" != "$version" ]; then
            echo "::error::тег v$version, а в VERSION $declared"
            fail=1
          fi

          # CHANGELOG обязан описывать выпускаемую версию: из него берутся
          # заметки к релизу, и без раздела релиз выйдет пустым.
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::в CHANGELOG.md нет раздела ## [$version]"; fail=1; }

          exit $fail

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Собрать архивы для Linux и Windows
        run: make dist

      - name: Контрольные суммы
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          ls -lh

      - name: Заметки к релизу из CHANGELOG
        run: |
          python3 - "${{ steps.version.outputs.value }}" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)",
              text, re.M | re.S,
          )
          print((match.group(1).strip() if match else "").strip())
          PY
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: AWG Client ${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
