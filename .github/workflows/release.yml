name: Релиз

# Релиз выпускается пушем тега: git tag -a v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]

# Нужно для публикации релиза от имени GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    name: Сборка пакетов
    # Не ubuntu-latest: AppImage и .deb собираются под glibc той системы, где
    # их собрали, поэтому берём самую старую поддерживаемую — иначе пакеты не
    # заведутся на дистрибутивах старше раннера.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Версия из тега
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Расхождение версии в теге и в манифестах — ровно то, из-за чего в
      # релизе оказываются файлы с чужим номером. Ловим до сборки.
      - name: Проверить, что версия в тегe и в манифестах совпадают
        run: |
          version='${{ steps.version.outputs.value }}'
          manifest=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "$version" != "$manifest" ]; then
            echo "::error::тег v$version, а в tauri.conf.json версия $manifest"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            file

      - name: Собрать .deb и AppImage
        run: make desktop

      # Tauri именует файлы по productName, и «AWG Client» превращается в
      # «AWG.Client_1.0.0_amd64.deb». Приводим к имени пакета.
      - name: Разложить артефакты
        id: artifacts
        run: |
          set -eu
          version='${{ steps.version.outputs.value }}'
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p dist
          cp "$(find "$bundle/deb" -name '*.deb' -print -quit)" \
             "dist/awg-client_${version}_amd64.deb"
          cp "$(find "$bundle/appimage" -name '*.AppImage' -print -quit)" \
             "dist/awg-client_${version}_amd64.AppImage"
          (cd dist && sha256sum ./*.deb ./*.AppImage > SHA256SUMS)
          ls -lh dist

      - name: Заметки к релизу из CHANGELOG
        run: |
          python3 - "${{ steps.version.outputs.value }}" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)",
              text, re.M | re.S,
          )
          print((match.group(1).strip() if match else "").strip())
          PY
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: AWG Client ${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
