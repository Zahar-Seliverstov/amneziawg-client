name: Релиз

# Релиз выпускается пушем тега: git tag -a v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]

# Нужно для публикации релиза от имени GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    name: Сборка пакетов
    # Не ubuntu-latest: AppImage и .deb собираются под glibc той системы, где
    # их собрали, поэтому берём самую старую поддерживаемую — иначе пакеты не
    # заведутся на дистрибутивах старше раннера.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Версия из тега
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Расхождение версии в теге и в манифестах — ровно то, из-за чего в
      # релизе оказываются файлы с чужим номером. Ловим до сборки.
      #
      # Проверяем ВСЕ манифесты, а не один. Номер объявлен в трёх местах, и
      # разъезжается ровно тот, который забыли: раньше сверялся только
      # tauri.conf.json, и .deb мог уехать с чужим номером в имени пакета.
      - name: Проверить, что версия в теге и в манифестах совпадает
        run: |
          version='${{ steps.version.outputs.value }}'
          fail=0

          check() {
            if [ "$2" != "$version" ]; then
              echo "::error::тег v$version, а в $1 версия ${2:-<не найдена>}"
              fail=1
            fi
          }

          check desktop/src-tauri/tauri.conf.json \
            "$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")"
          check desktop/package.json \
            "$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")"
          check desktop/src-tauri/Cargo.toml \
            "$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml)"

          # CHANGELOG обязан описывать выпускаемую версию: из него берутся
          # заметки к релизу, и без раздела релиз выйдет пустым.
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::в CHANGELOG.md нет раздела ## [$version]"; fail=1; }

          exit $fail

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            file

      - name: Собрать .deb и AppImage
        run: make desktop

      # Tauri именует файлы по productName, и «AWG Client» превращается в
      # «AWG.Client_1.0.0_amd64.deb». Приводим к имени пакета.
      - name: Разложить артефакты
        id: artifacts
        run: |
          set -eu
          version='${{ steps.version.outputs.value }}'
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p dist
          cp "$(find "$bundle/deb" -name '*.deb' -print -quit)" \
             "dist/awg-client_${version}_amd64.deb"
          cp "$(find "$bundle/appimage" -name '*.AppImage' -print -quit)" \
             "dist/awg-client_${version}_amd64.AppImage"
          (cd dist && sha256sum ./*.deb ./*.AppImage > SHA256SUMS)
          ls -lh dist

      - name: Заметки к релизу из CHANGELOG
        run: |
          python3 - "${{ steps.version.outputs.value }}" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)",
              text, re.M | re.S,
          )
          print((match.group(1).strip() if match else "").strip())
          PY
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: AWG Client ${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
