<!doctype html>
<meta charset="utf-8">
<title>AWG Client</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e6e8ee;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .box { text-align: center; max-width: 32rem; padding: 2rem; }
  /* Пульсация вместо спиннера: логотип сам показывает, что идёт запуск. */
  .logo {
    display: block; margin: 0 auto 1.25rem; width: 72px; height: 72px;
    background-color: #ffffff;
    -webkit-mask: url('./logo-mono.svg') no-repeat center / contain;
    mask: url('./logo-mono.svg') no-repeat center / contain;
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .72; transform: scale(.94); }
  }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .35rem; }
  p { margin: 0; color: #9aa3b5; }
  pre {
    margin: 1rem 0 0; padding: .75rem; text-align: left; white-space: pre-wrap;
    background: #171a21; border: 1px solid #262b36; border-radius: 6px;
    color: #ff8f8f; font-size: 12px;
  }
  .error .logo { animation: none; opacity: .45; }
</style>
<div class="box" id="box">
  <span class="logo" aria-hidden="true"></span>
  <h1 id="title">Запуск службы AmneziaWG…</h1>
  <p id="hint">Подтвердите права администратора — они нужны для TUN-интерфейса и маршрутов.</p>
  <pre id="detail" hidden></pre>
</div>
<script>
  // Оболочка (Rust) зовёт эту функцию, если backend поднять не удалось.
  window.awgError = function (message) {
    document.getElementById('box').classList.add('error');
    document.getElementById('title').textContent = 'Не удалось запустить службу';
    document.getElementById('hint').textContent = 'Окно можно закрыть и попробовать снова.';
    var detail = document.getElementById('detail');
    detail.hidden = false;
    detail.textContent = message;
  };
</script>
