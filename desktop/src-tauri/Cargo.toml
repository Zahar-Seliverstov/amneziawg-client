[package]
name = "awg-client-desktop"
version = "1.1.0"
edition = "2021"
description = "Десктопная оболочка клиента AmneziaWG"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Плагины намеренно не подключены: оболочке нужно только окно, всё остальное
# делает backend. Меньше зависимостей — меньше бинарник и площадь атаки.
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
gtk = "0.18"
# Трей — свой StatusNotifierItem: только так левый клик отличается от правого
# (подробности в src/tray.rs). Заодно уходит libayatana-appindicator.
ksni = { version = "0.3", features = ["blocking"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
