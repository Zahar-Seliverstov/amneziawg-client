[package]
name = "awg-client-desktop"
version = "1.0.0"
edition = "2021"
description = "Десктопная оболочка AmneziaWG Web Client"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Плагины намеренно не подключены: оболочке нужно только окно, всё остальное
# делает backend. Меньше зависимостей — меньше бинарник и площадь атаки.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
